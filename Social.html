<style>
*{
  box-sizing:border-box;
}
html,
body{
  margin:0 !important;
  padding:0 !important;
  background:#000000 !important;
  color:#ffffff !important;
  font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;
  min-height:100%;
}
body{
  background:#000000 !important;
}
main{
  max-width:900px;
  margin:auto;
  padding:22px 16px 40px;
  background:#000000 !important;
  min-height:100vh;
}
/* K&M HEADER */
h1{
  margin:0;
  font-size:30px;
  font-weight:900;
  color:#e21b23;
  letter-spacing:-.5px;
  text-shadow:
    0 0 8px rgba(226,27,35,.4),
    0 0 18px rgba(226,27,35,.2);
}
.sub{
  color:#aaa;
  margin:5px 0 18px;
}
/* BUTTONS */
.tabs{
  display:flex;
  gap:8px;
  margin-bottom:14px;
}
button{
  border:1px solid #333 !important;
  background:#111111 !important;
  color:#ffffff !important;
  border-radius:12px;
  padding:11px 20px;
  font-weight:700;
  font-size:15px;
}
button.active{
  background:#e21b23 !important;
  color:#ffffff !important;
  border-color:#e21b23 !important;
  box-shadow:0 0 14px rgba(226,27,35,.4);
}
/* CARDS */
.card{
  background:#0d0d0d !important;
  border:1px solid #292929 !important;
  border-radius:20px;
  padding:16px;
  margin-bottom:14px;
  box-shadow:0 5px 20px rgba(0,0,0,.5);
}
h2{
  margin:0 0 14px;
  font-size:21px;
  color:#ffffff !important;
  font-weight:800;
}
h2:after{
  content:"";
  display:block;
  width:42px;
  height:3px;
  background:#e21b23;
  border-radius:5px;
  margin-top:7px;
  box-shadow:0 0 8px rgba(226,27,35,.5);
}
/* METRICS */
.metrics{
  display:grid;
  grid-template-columns:repeat(4,1fr);
  gap:9px;
}
.metric{
  border-radius:14px;
  padding:12px;
  border-left:5px solid #777;
  background:#181818 !important;
}
.metric small{
  display:block;
  color:#999 !important;
}
.metric b{
  font-size:21px;
  display:block;
  margin-top:4px;
  color:#ffffff !important;
}
.instagram{
  border-left-color:#d62976;
}
.facebook{
  border-left-color:#1877f2;
}
.tiktok{
  border-left-color:#111;
}
.total{
  border-left-color:#e21b23;
}
/* YEAR BOXES */
.yearbox{
  display:grid;
  grid-template-columns:1fr 1fr;
  gap:12px;
}
.year{
  border-radius:15px;
  padding:15px;
  background:#181818 !important;
  border:1px solid #292929 !important;
}
.year h3{
  margin:0 0 10px;
  font-size:17px;
  color:#e21b23 !important;
}
.yearrow{
  display:flex;
  justify-content:space-between;
  padding:5px 0;
  border-bottom:1px solid #292929 !important;
  font-size:14px;
  color:#ffffff !important;
}
.yearrow:last-child{
  border-bottom:0;
  font-weight:800;
}
/* GAINS */
.gainbox{
  display:grid;
  grid-template-columns:1fr 1fr;
  gap:12px;
}
.gain{
  border-radius:15px;
  padding:15px;
  background:#181818 !important;
  border:1px solid #292929 !important;
}
.gain h3{
  margin:0 0 10px;
  font-size:17px;
  color:#e21b23 !important;
}
.gainrow{
  display:flex;
  justify-content:space-between;
  padding:7px 0;
  border-bottom:1px solid #292929 !important;
  font-size:14px;
  color:#ffffff !important;
}
.gainrow:last-child{
  border-bottom:0;
  font-weight:800;
}
.positive{
  font-weight:800;
  color:#4ade80 !important;
}
.negative{
  font-weight:800;
  color:#ff5a5f !important;
}
/* CHART */
canvas{
  width:100%;
  height:auto;
  margin-top:18px;
  display:block;
  background:#0d0d0d !important;
  border-radius:12px;
}
/* SLIDER */
input{
  width:100%;
  height:38px;
  margin-top:10px;
  accent-color:#e21b23;
  background:#111111 !important;
}
/* LEGEND */
.ends{
  display:flex;
  justify-content:space-between;
  color:#777 !important;
  font-size:12px;
}
.legend{
  display:flex;
  gap:18px;
  flex-wrap:wrap;
  margin-top:10px;
  font-size:13px;
  color:#bbb !important;
}
.dot{
  display:inline-block;
  width:10px;
  height:10px;
  border-radius:50%;
  margin-right:5px;
}
.note{
  font-size:13px;
  color:#777 !important;
  margin-top:-5px;
  margin-bottom:12px;
}
/* MOBILE */
@media(max-width:600px){
  .metrics{
    grid-template-columns:repeat(2,1fr);
  }
  .yearbox,
  .gainbox{
    grid-template-columns:1fr;
  }
  h1{
    font-size:27px;
  }
}
</style>
