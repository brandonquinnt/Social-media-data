<!DOCTYPE html>
<html>
<head>
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Social Media Data</title>
<style>
*{box-sizing:border-box}
body{margin:0;background:#f4f5f7;color:#111;font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif}
main{max-width:900px;margin:auto;padding:22px 16px 40px}
h1{margin:0;font-size:30px}
.sub{color:#666;margin:5px 0 18px}
.tabs{display:flex;gap:8px;margin-bottom:14px}
button{border:1px solid #ddd;background:white;border-radius:12px;padding:11px 20px;font-weight:700;font-size:15px}
button.active{background:#111;color:white}
.card{background:white;border:1px solid #ddd;border-radius:20px;padding:16px;margin-bottom:14px}
h2{margin:0 0 14px;font-size:21px}
.metrics{display:grid;grid-template-columns:repeat(4,1fr);gap:9px}
.metric{border-radius:14px;padding:12px;border-left:5px solid #999;background:#f7f7f7}
.metric small{display:block;color:#666}
.metric b{font-size:21px;display:block;margin-top:4px}
.instagram{border-left-color:#d62976}
.facebook{border-left-color:#1877f2}
.tiktok{border-left-color:#111}
.total{border-left-color:#777}
.yearbox{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.year{border-radius:15px;padding:15px;background:#f7f7f7}
.year h3{margin:0 0 10px;font-size:17px}
.yearrow{display:flex;justify-content:space-between;padding:5px 0;border-bottom:1px solid #ddd;font-size:14px}
.yearrow:last-child{border-bottom:0;font-weight:800}
canvas{width:100%;height:auto;margin-top:18px;display:block}
input{width:100%;height:38px;margin-top:10px;accent-color:#111}
.ends{display:flex;justify-content:space-between;color:#777;font-size:12px}
.legend{display:flex;gap:18px;flex-wrap:wrap;margin-top:10px;font-size:13px}
.dot{display:inline-block;width:10px;height:10px;border-radius:50%;margin-right:5px}
@media(max-width:600px){
.metrics{grid-template-columns:repeat(2,1fr)}
.yearbox{grid-template-columns:1fr}
h1{font-size:27px}
}
</style>
</head>

<body>
<main>

<h1>Social Media Data</h1>
<div class="sub">Interactive monthly performance</div>

<div class="tabs">
<button id="viewsBtn" class="active">Views</button>
<button id="followersBtn">Followers</button>
</div>

<div class="card">
<h2 id="month"></h2>
<div class="metrics" id="metrics"></div>

<canvas id="chart" width="860" height="380"></canvas>

<div class="legend">
<span><i class="dot" style="background:#d62976"></i>Instagram</span>
<span><i class="dot" style="background:#1877f2"></i>Facebook</span>
<span><i class="dot" style="background:#111"></i>TikTok</span>
</div>

<input id="slider" type="range" min="0" max="19" value="19" step="1">

<div class="ends">
<span>Jan '25</span>
<span>Aug '26</span>
</div>
</div>

<div class="card">
<h2>Year-to-Date & Annual Totals</h2>
<div class="yearbox">

<div class="year">
<h3>2025 Total Views</h3>
<div class="yearrow"><span>Instagram</span><b id="ig2025"></b></div>
<div class="yearrow"><span>Facebook</span><b id="fb2025"></b></div>
<div class="yearrow"><span>TikTok</span><b id="tt2025"></b></div>
<div class="yearrow"><span>Total Views</span><b id="total2025"></b></div>
</div>

<div class="year">
<h3 id="ytdTitle">2026 YTD Views</h3>
<div class="yearrow"><span>Instagram</span><b id="ig2026"></b></div>
<div class="yearrow"><span>Facebook</span><b id="fb2026"></b></div>
<div class="yearrow"><span>TikTok</span><b id="tt2026"></b></div>
<div class="yearrow"><span>Total Views</span><b id="total2026"></b></div>
</div>

</div>
</div>

</main>

<script>

const months=[
"Jan '25","Feb '25","Mar '25","Apr '25","May '25","Jun '25",
"Jul '25","Aug '25","Sep '25","Oct '25","Nov '25","Dec '25",
"Jan '26","Feb '26","Mar '26","Apr '26","May '26","Jun '26",
"Jul '26","Aug '26"
];

const views={

Instagram:[
10000,16000,19000,54000,24000,37000,
123000,301000,457000,3100000,3000000,2900000,
1600000,2400000,921000,806000,593000,893000,
911000,3300000
],

Facebook:[
2600,1700,4400,2100,2400,2700,
6000,505000,3700000,3600000,1500000,2400000,
1500000,2500000,1500000,1600000,1500000,2600000,
6700000,8400000
],

TikTok:[
3000,1900,2200,1200,2600,3000,
3300,5500,7500,203000,1100000,143000,
229000,200000,276000,330000,200000,150000,
170000,100000
]

};

const followers={

Instagram:[
1500,1600,1800,1900,2700,2900,
3000,3200,3300,3800,6200,8300,
11000,13000,15000,16000,17000,18000,
20000,22600
],

Facebook:[
2800,2900,3000,3000,3100,3100,
3200,3300,3300,3400,3500,8000,
10000,13000,15000,17300,18800,20000,
22300,29200
],

TikTok:[
0,0,0,0,10,40,
50,78,150,700,1400,1700,
2000,2200,2900,3200,3500,3700,
3900,4600
]

};

let mode="views";
let index=19;

function formatNumber(n){

if(n>=1000000)
return (n/1000000).toFixed(n%1000000?1:0)+"M";

if(n>=1000)
return (n/1000).toFixed(n%1000?1:0)+"K";

return n.toLocaleString();

}

function exact(n){
return n.toLocaleString();
}

function sum(arr,start,end){

let total=0;

for(let i=start;i<=end;i++)
total+=arr[i];

return total;

}

function updateYearTotals(){

/* 2025 = Jan-Dec */
let ig25=sum(views.Instagram,0,11);
let fb25=sum(views.Facebook,0,11);
let tt25=sum(views.TikTok,0,11);

document.getElementById("ig2025").textContent=formatNumber(ig25);
document.getElementById("fb2025").textContent=formatNumber(fb25);
document.getElementById("tt2025").textContent=formatNumber(tt25);

document.getElementById("total2025").textContent=
formatNumber(ig25+fb25+tt25);

/* 2026 YTD */
let end=index<12?11:index;

let ig26=0;
let fb26=0;
let tt26=0;

if(index>=12){

ig26=sum(views.Instagram,12,index);
fb26=sum(views.Facebook,12,index);
tt26=sum(views.TikTok,12,index);

}

document.getElementById("ig2026").textContent=formatNumber(ig26);
document.getElementById("fb2026").textContent=formatNumber(fb26);
document.getElementById("tt2026").textContent=formatNumber(tt26);

document.getElementById("total2026").textContent=
formatNumber(ig26+fb26+tt26);

document.getElementById("ytdTitle").textContent=
index>=12
?"2026 YTD Views"
:"2026 YTD Views";
}

function draw(){

let data=mode==="views"?views:followers;

let names=["Instagram","Facebook","TikTok"];

let vals=names.map(function(n){
return data[n][index];
});

document.getElementById("month").textContent=months[index];

let box=document.getElementById("metrics");

box.innerHTML="";

let classes=["instagram","facebook","tiktok"];

names.forEach(function(n,j){

box.innerHTML+=
'<div class="metric '+classes[j]+'">'+
'<small>'+n+'</small>'+
'<b>'+formatNumber(vals[j])+'</b>'+
'</div>';

});

box.innerHTML+=
'<div class="metric total">'+
'<small>Total</small>'+
'<b>'+formatNumber(vals[0]+vals[1]+vals[2])+'</b>'+
'</div>';

drawChart(data,names);

updateYearTotals();

}

function drawChart(data,names){

let canvas=document.getElementById("chart");
let ctx=canvas.getContext("2d");

let W=canvas.width;
let H=canvas.height;

let L=60;
let R=20;
let T=20;
let B=45;

let PW=W-L-R;
let PH=H-T-B;

ctx.clearRect(0,0,W,H);

let all=[];

names.forEach(function(n){
all=all.concat(data[n]);
});

let max=Math.max.apply(null,all)||1;

ctx.fillStyle="#fafafa";
ctx.fillRect(L,T,PW,PH);

ctx.font="12px Arial";
ctx.fillStyle="#777";
ctx.strokeStyle="#e5e5e5";
ctx.lineWidth=1;

for(let g=0;g<=4;g++){

let y=T+PH*g/4;
let value=max*(1-g/4);

ctx.beginPath();
ctx.moveTo(L,y);
ctx.lineTo(W-R,y);
ctx.stroke();

ctx.fillText(formatNumber(value),5,y+4);

}

let colors=["#d62976","#1877f2","#111"];

names.forEach(function(name,j){

let arr=data[name];

ctx.strokeStyle=colors[j];
ctx.lineWidth=3;

ctx.beginPath();

arr.forEach(function(value,k){

let x=L+PW*k/19;
let y=T+PH-(value/max)*PH;

if(k===0)
ctx.moveTo(x,y);
else
ctx.lineTo(x,y);

});

ctx.stroke();

let x=L+PW*index/19;
let y=T+PH-(arr[index]/max)*PH;

ctx.fillStyle=colors[j];

ctx.beginPath();
ctx.arc(x,y,6,0,Math.PI*2);
ctx.fill();

});

}

document.getElementById("slider").addEventListener("input",function(){

index=Number(this.value);
draw();

});

document.getElementById("viewsBtn").addEventListener("click",function(){

mode="views";

this.className="active";
document.getElementById("followersBtn").className="";

draw();

});

document.getElementById("followersBtn").addEventListener("click",function(){

mode="followers";

this.className="active";
document.getElementById("viewsBtn").className="";

draw();

});

draw();

</script>

</body>
</html>
